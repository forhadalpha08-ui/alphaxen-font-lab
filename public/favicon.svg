<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="ax-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Background Gradient -->
    <linearGradient id="ax-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ax-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22d3ee" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ax-border-grad)" />

  <!-- Inner Dark Obsidian Card Surface -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="url(#ax-bg-grad)" />

  <!-- Inner Subtle Specular Rim -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="12.5" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="none" />

  <!-- Alphaxen Brand Monogram: A (Alpha Cyan) + X (Xen Purple) -->
  <g transform="translate(16, 16)" filter="url(#ax-glow)">
    <!-- Letter A (Electric Cyan) -->
    <path
      d="M6 24L12 8L18 24"
      stroke="#22d3ee"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M8.5 18H15.5"
      stroke="#22d3ee"
      stroke-width="2.6"
      stroke-linecap="round"
    />

    <!-- Letter X (Cosmic Purple) -->
    <path
      d="M17 12L26 24M26 12L17 24"
      stroke="#c084fc"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
